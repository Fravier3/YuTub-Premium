<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Yutu Premium</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Yutu Premium: videos sin rastreo, con una interfaz que se siente como en casa.">
<meta name="theme-color" content="#0f0f0f" id="themeColor">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Yutu Premium">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/logo.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="topbar" id="topbar">
  <div class="tb-left">
    <button class="icon-btn" id="menuBtn" aria-label="Menú">
      <svg viewBox="0 0 24 24"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
    </button>
    <a class="brand" href="#/" aria-label="Yutu Premium, inicio">
      <img src="icons/logo.svg" alt="" width="40" height="25">
      <span class="brand-name">Yutu<sup>Premium</sup></span>
    </a>
  </div>
  <form class="search" id="searchForm" role="search" autocomplete="off">
    <button type="button" class="icon-btn search-back" id="searchBack" aria-label="Cerrar búsqueda">
      <svg viewBox="0 0 24 24"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg>
    </button>
    <div class="search-box">
      <input id="q" type="search" placeholder="Buscar" aria-label="Buscar" enterkeyhint="search">
      <button type="button" class="search-clear" id="qClear" aria-label="Borrar"><svg viewBox="0 0 24 24"><path d="M19 6.4 17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"/></svg></button>
      <ul class="suggest" id="suggest" role="listbox"></ul>
    </div>
    <button class="search-btn" type="submit" aria-label="Buscar"><svg viewBox="0 0 24 24"><path d="M20.9 19.5l-5.4-5.4a7 7 0 1 0-1.4 1.4l5.4 5.4zM5 10a5 5 0 1 1 10 0 5 5 0 0 1-10 0z"/></svg></button>
  </form>
  <div class="tb-right">
    <button class="icon-btn only-mobile" id="searchOpen" aria-label="Buscar"><svg viewBox="0 0 24 24"><path d="M20.9 19.5l-5.4-5.4a7 7 0 1 0-1.4 1.4l5.4 5.4zM5 10a5 5 0 1 1 10 0 5 5 0 0 1-10 0z"/></svg></button>
    <button class="icon-btn" id="themeBtn" aria-label="Cambiar tema"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.5 0-.9-.1-1.4A5.5 5.5 0 0 1 13.4 3.1C13 3 12.5 3 12 3z"/></svg></button>
    <a class="icon-btn" href="#/ajustes" aria-label="Ajustes"><svg viewBox="0 0 24 24"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.4-2.5 1a7 7 0 0 0-1.7-1L15 3h-4l-.4 3a7 7 0 0 0-1.7 1l-2.5-1-2 3.4L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.4 2.5-1a7 7 0 0 0 1.7 1l.4 3h4l.4-3a7 7 0 0 0 1.7-1l2.5 1 2-3.4zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg></a>
    <span class="avatar" aria-hidden="true">Y</span>
  </div>
</header>

<div class="scrim" id="scrim"></div>
<aside class="sidebar" id="sidebar" aria-label="Navegación"></aside>
<main class="main" id="main" tabindex="-1"></main>
<nav class="bottomnav" id="bottomnav" aria-label="Navegación principal"></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>const APP_VERSION = '1.0.0';</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
