<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sin conexión</title>
<style>
  html,body{height:100%;margin:0;background:#0f0f0f;color:#f1f1f1;font-family:Roboto,sans-serif}
  main{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:0 5%}
  h1{font-size:2.2rem;margin:0}
  p{font-size:1.3rem;color:#aaa;margin:0}
  button{font-size:1.4rem;padding:14px 40px;border:0;border-radius:40px;background:#f20000;color:#fff;margin-top:16px}
  button:focus{outline:4px solid #fff;outline-offset:4px}
</style>
</head>
<body>
<main>
  <h1>No hay conexión a internet</h1>
  <p>Revisa tu red y pulsa el botón para reintentar.</p>
  <button id="retry" autofocus>Reintentar</button>
</main>
<script>
  document.getElementById('retry').addEventListener('click', function () {
    if (window.YutuTV) window.YutuTV.retry();
  });
  document.getElementById('retry').focus();
</script>
</body>
</html>
