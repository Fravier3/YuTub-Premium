name: APK Android TV
on:
  push:
    branches: [main, claude/beautiful-archimedes-xcfubr]
    paths:
      - 'android/**'
      - '.github/workflows/android-tv.yml'
      # El APK lleva su propia copia de la app; cambiar la web NO regenera el APK.
      # Para incluir cambios de la app en el APK: Actions > "APK Android TV" > Run workflow.
  workflow_dispatch:
  schedule:
    # Una vez por semana: mantiene viva la clave de firma guardada en la caché (GitHub borra cachés sin uso a los 7 días)
    - cron: '17 6 * * 1'

permissions:
  contents: write

jobs:
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: android/keystore
          key: yutu-keystore-v1

  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # La app de TV va DENTRO del APK (variante propia, portada latina), así que no depende de la web publicada
      - name: Compilar la app de TV e incluirla en el APK
        run: |
          pnpm install --frozen-lockfile
          pnpm run pack:tv
          mkdir -p android/app/src/main/assets
          rm -rf android/app/src/main/assets/www
          cp -r dist/tv android/app/src/main/assets/www
          test -f android/app/src/main/assets/www/index.html

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # Clave de firma: si defines los secretos ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD
      # y ANDROID_KEY_ALIAS se usan esos; si no, se crea una clave propia una sola vez y se guarda en la caché.
      - name: Restaurar clave de firma
        uses: actions/cache@v4
        with:
          path: android/keystore
          key: yutu-keystore-v1

      - name: Preparar clave de firma
        env:
          SECRET_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SECRET_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SECRET_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          mkdir -p android/keystore
          if [ -n "$SECRET_KEYSTORE" ]; then
            echo "$SECRET_KEYSTORE" | base64 -d > android/keystore/yutu.jks
            echo "$SECRET_PASSWORD" > android/keystore/password.txt
            echo "$SECRET_ALIAS" > android/keystore/alias.txt
            echo "Usando la clave de los secretos del repositorio."
          elif [ ! -f android/keystore/yutu.jks ]; then
            PASS=$(openssl rand -hex 16)
            keytool -genkeypair -v -keystore android/keystore/yutu.jks -storetype PKCS12 \
              -alias yutu -keyalg RSA -keysize 4096 -validity 36500 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=Yutu Premium, O=Yutu Premium, C=PR"
            echo "$PASS" > android/keystore/password.txt
            echo "yutu" > android/keystore/alias.txt
            echo "Clave nueva creada."
          else
            echo "Usando la clave guardada en la caché."
          fi

      - name: Compilar y firmar APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          export KEYSTORE_PATH="$GITHUB_WORKSPACE/android/keystore/yutu.jks"
          export KEYSTORE_PASSWORD="$(cat android/keystore/password.txt)"
          export KEY_PASSWORD="$KEYSTORE_PASSWORD"
          export KEY_ALIAS="$(cat android/keystore/alias.txt)"
          gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Verificar firma
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          cp "$APK" YutuPremium-TV.apk

      - name: Guardar APK como archivo de la ejecución
        uses: actions/upload-artifact@v7
        with:
          name: YutuPremium-TV
          path: YutuPremium-TV.apk
          retention-days: 14

      # Copia con enlace "raw" fijo: https://raw.githubusercontent.com/<repo>/apk/YutuPremium-TV.apk
      # Vive en una rama aparte con un solo commit, para no engordar el historial de main.
      - name: Publicar copia directa (raw) en la rama apk
        if: github.ref == 'refs/heads/main'
        continue-on-error: true # si falla, el release de arriba igual se publica
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/apkbranch && mkdir /tmp/apkbranch
          cp YutuPremium-TV.apk /tmp/apkbranch/
          cd /tmp/apkbranch
          git init -q -b apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add YutuPremium-TV.apk
          git commit -q -m "APK Yutu Premium TV 1.0.${{ github.run_number }}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push -f origin apk

      - name: Publicar en Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tv-v1.0.${{ github.run_number }}
          name: Yutu Premium TV 1.0.${{ github.run_number }}
          make_latest: true
          files: YutuPremium-TV.apk
          body: |
            APK firmado de Yutu Premium para Android TV (y teléfonos/tablets Android).

            **Instalar:** descarga `YutuPremium-TV.apk`, cópialo a la TV (USB o la app "Send Files to TV") y ábrelo,
            o instálalo con `adb install -r YutuPremium-TV.apk`. Hay que permitir "instalar apps de orígenes desconocidos".

            La interfaz se actualiza sola desde la web; este APK solo se vuelve a instalar cuando cambia la parte nativa.
